        <div class="  card bg-white rounded-2xl shadow-lg  transition-all duration-300 overflow-hidden border border-gray-200" [routerLink]="['/products', product.id]">
            <div class="relative w-full bg-gray-50 p-6">
                <span class="absolute top-3 left-3 text-white text-xs font-semibold px-3 py-1 rounded-full " [ngClass]="isInStock ? 'bg-green-500' : 'bg-red-500'">
                    {{stockBadge}}
                </span>
                <img class="w-full h-48 object-contain" [src]="product.thumbnail" [alt]="product.title">
            </div>
            <div class="p-5 space-y-3">
                <div class="flex flex-row justify-between items-start">
                    <p class="font-bold text-xl text-gray-800">{{product.title}}</p>
                    <span class="text-blue-600 font-bold text-lg">{{ product.price | currency:'USD' }}</span>
                </div>
                <p class="text-gray-500 text-sm line-clamp-2">
                    {{product.description}}
                </p>
                <div class="flex items-center gap-1">
                    <span class="text-yellow-400">{{ stars }}</span>
                    <span class="text-gray-400 text-xs">({{ product.rating }}.0)</span>
                </div>
                <button 
                    class="w-full font-semibold py-3 px-4 rounded-xl transition-colors duration-200 shadow-md"
                    (click)="addToCart($event)"
                    [disabled]="!isInStock"
                    [ngClass]="isInStock ? 
                        'bg-blue-600 hover:bg-blue-700 text-white hover:shadow-lg cursor-pointer' : 
                        'bg-gray-400 text-white cursor-not-allowed'">
                    {{ isInStock ? 'Add To Cart' : 'Out of Stock' }}
                </button>
            </div>
        </div>
