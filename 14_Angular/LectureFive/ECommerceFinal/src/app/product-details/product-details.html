<div class="container mx-auto p-8">
  @if (isLoading()) {
    <div class="flex justify-center items-center h-64">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
    </div>
  } @else {
    @if (product(); as product) {
      <app-productcomponent [product]="product"></app-productcomponent>
      <div class="mt-8 bg-white p-6 rounded-lg shadow-lg">
        <h2 class="text-2xl font-bold mb-4">Product Details</h2>
        <p class="text-gray-700">{{ product.description }}</p>
        <p class="mt-4"><strong>Price:</strong> {{ product.price | currency:'USD' }}</p>
        <p><strong>Stock:</strong> {{ product.stock }} units available</p>
      </div>
    } @else {
      <p class="text-center text-gray-500 text-xl font-bold mt-10">Product not found</p>
    }
  }
</div>
