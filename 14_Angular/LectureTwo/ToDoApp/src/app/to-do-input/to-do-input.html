<div class="flex flex-col bg-blue-500 p-4 gap-8 rounded-t-2xl w-96">
    <h1 class="text-2xl font-bold text-white">To-Do App!</h1>
    <input [(ngModel)]="todoText" class="border text-white border-white rounded-xl placeholder-white focus:outline-none focus:ring-2 focus:ring-white p-2" placeholder="Enter your task here" type="text" >
    <button (click)="onAddTodo()" class="border border-whitw rounded-xl py-2 px-4 self-end hover:bg-white hover:cursor-pointer hover:border-white hover:text-black text-white">Add</button>
</div>
