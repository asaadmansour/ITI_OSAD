<div class="flex flex-col border border-blue-400 bg-white p-4 gap-8 rounded-b-2xl w-96">
    @for (todo of todos; track $index) {
        <div class="task bg-blue-50 border border-blue-200 rounded-lg p-3 hover:bg-blue-100 hover:shadow-md transition-all cursor-pointer">
            {{ todo }}
        </div>
    }
</div>
