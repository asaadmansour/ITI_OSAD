<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Medical AI Agent</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --user-msg: #3b82f6;
            --ai-msg: rgba(51, 65, 85, 0.8);
            --border: rgba(255,255,255,0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(56, 189, 248, 0.15), transparent 25%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.4);
        }

        .header h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .download-btn {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            text-decoration: none;
            display: none;
        }

        .download-btn:hover {
            background-color: rgba(59, 130, 246, 0.1);
        }

        .download-anim {
            animation: slideIn 0.5s ease forwards;
            display: inline-block !important;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .saving-indicator {
            align-self: center;
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(34, 197, 94, 0.2);
            animation: pulseSave 1.5s infinite;
            margin: 10px 0;
        }

        @keyframes pulseSave {
            0% { opacity: 0.7; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.7; transform: scale(0.98); }
        }

        .chat-box {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        button.attach-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 48px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s ease;
        }

        button.attach-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
        }

        .image-preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            margin-top: 10px;
            display: block;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }
        .chat-box::-webkit-scrollbar-thumb {
            background-color: var(--border);
            border-radius: 10px;
        }

        .message {
            max-width: 80%;
            padding: 14px 18px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.ai {
            background: var(--ai-msg);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border);
            white-space: pre-wrap;
        }

        .message.user {
            background: var(--user-msg);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.2);
        }

        .input-area {
            padding: 20px 30px;
            background: rgba(15, 23, 42, 0.4);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 15px;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 14px 20px;
            border-radius: 30px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button.send-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button.send-btn:hover {
            background: var(--primary-hover);
        }

        .loading-dots {
            display: flex;
            gap: 4px;
            align-items: center;
            height: 20px;
        }
        
        .loading-dots span {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1><div class="status-dot"></div> MedAgent AI</h1>
            <a href="http://127.0.0.1:8000/download_csv/" class="download-btn" target="_blank">Download CSV</a>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message ai">Hello! I am your Medical AI Assistant. Please provide descriptions of MRI results or structured symptoms. I can log valid cases into our structured system or look up nearby hospitals for you!</div>
        </div>

        <div class="input-area">
            <input type="file" id="imageUpload" accept="image/*" style="display: none;">
            <button class="attach-btn" onclick="document.getElementById('imageUpload').click()" title="Attach MRI Scan">📎</button>
            <input type="text" id="userInput" placeholder="Describe symptoms or request hospital search..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        let currentBase64Image = null;

        document.getElementById('imageUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    currentBase64Image = evt.target.result;
                    const attachBtn = document.querySelector('.attach-btn');
                    attachBtn.style.color = '#22c55e';
                    attachBtn.style.borderColor = '#22c55e';
                    
                    let preview = document.getElementById('uploadPreview');
                    if (!preview) {
                        preview = document.createElement('img');
                        preview.id = 'uploadPreview';
                        preview.style.width = '45px';
                        preview.style.height = '45px';
                        preview.style.objectFit = 'cover';
                        preview.style.borderRadius = '8px';
                        preview.style.marginLeft = '10px';
                        attachBtn.parentNode.insertBefore(preview, attachBtn.nextSibling);
                    }
                    preview.src = currentBase64Image;
                };
                reader.readAsDataURL(file);
            }
        });

        userInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message && !currentBase64Image) return;

            let userDisplay = message;
            if (currentBase64Image) {
                userDisplay += `<br><img class="image-preview" src="${currentBase64Image}" />`;
            }

            appendMessage(userDisplay, 'user');
            userInput.value = '';
            
            const sendingImage = currentBase64Image;
            currentBase64Image = null;
            const attachBtn = document.querySelector('.attach-btn');
            attachBtn.style.color = 'var(--text-muted)';
            attachBtn.style.borderColor = 'var(--border)';
            document.getElementById('imageUpload').value = '';
            
            const preview = document.getElementById('uploadPreview');
            if(preview) preview.remove();

            const loadingId = 'loading-' + Date.now();
            const loadingHTML = `<div class="loading-dots"><span></span><span></span><span></span></div>`;
            appendMessage(loadingHTML, 'ai', loadingId);

            const requestBody = { message: message };
            if (sendingImage) {
                requestBody.image = sendingImage;
            }

            try {
                const response = await fetch('http://127.0.0.1:8000/chat_api/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await response.json();
                
                // Remove loading
                document.getElementById(loadingId).remove();
                
                if(data.response) {
                    appendMessage(data.response, 'ai');
                    
                    if (data.response.toLowerCase().includes('save') || data.response.toLowerCase().includes('csv')) {
                        const savingAnim = document.createElement('div');
                        savingAnim.className = 'saving-indicator';
                        savingAnim.innerHTML = '💾 Saving records to CSV...';
                        chatBox.appendChild(savingAnim);
                        chatBox.scrollTop = chatBox.scrollHeight;
                        
                        setTimeout(() => {
                            savingAnim.remove();
                            const btn = document.querySelector('.download-btn');
                            btn.style.display = 'inline-block';
                            btn.classList.add('download-anim');
                        }, 1500);
                    }
                } else {
                    appendMessage("Error: " + (data.error || "Something went wrong!"), 'ai');
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                appendMessage("Error connecting to server. Is Django running?", 'ai');
            }
        }

        function appendMessage(content, sender, id = null) {
            const div = document.createElement('div');
            div.className = 'message ' + sender;
            if (id) div.id = id;
            div.innerHTML = sender === 'ai' && !id ? formatMarkdown(content) : content;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function formatMarkdown(text) {
            return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                       .replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
