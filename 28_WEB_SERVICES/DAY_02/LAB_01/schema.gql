type User {
  id: ID!
  fullName: String!
  email: String!
  dob: String
}

type Article {
  id: ID!
  title: String!
  content: String!
  author: User!
}

type Comment {
  id: ID!
  content: String!
  article: Article!
}

type Query {
  users: [User!]
  user(id: ID!): User
  articles: [Article!]
  article(id: ID!): Article
  comments: [Comment!]
  comment(id: ID!): Comment
}

input CreateUserInput {
  id: ID!
  fullName: String!
  email: String!
  dob: String
}

input CreateArticleInput {
  id: ID!
  title: String!
  content: String!
  authorId: ID!
}

input CreateCommentInput {
  id: ID!
  content: String!
  articleId: ID!
}

type Mutation {
  createUser(data: CreateUserInput!): User!
  createArticle(data: CreateArticleInput!): Article!
  createComment(data: CreateCommentInput!): Comment!
}
